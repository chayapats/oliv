[workspace]
members = ["crates/oliv-text", "crates/oliv-transport", "crates/oliv-sidecar", "crates/oliv-tokenizer"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 3
