name: Mac app

on:
  push:
    branches: [main]
    paths:
      - 'macos/**'
      - 'rust/**'
      - 'scripts/**'
      - 'tools/**'
      - 'benchmark/run_ane_foundation.sh'
      - '.github/workflows/mac.yml'
  pull_request:
    paths:
      - 'macos/**'
      - 'rust/**'
      - 'scripts/**'
      - 'tools/**'
      - 'benchmark/run_ane_foundation.sh'
      - '.github/workflows/mac.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Format and lint
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --locked --manifest-path rust/Cargo.toml --workspace

  app:
    name: Native runtime and XCTest
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # One rustc call first: rustup finishes any component download here, not
      # across cargo's parallel build, where the downloads collide.
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version
          echo "OLIV_CARGO=$(command -v cargo)" >> "$GITHUB_ENV"
      - name: Build tools
        run: brew install xcodegen ripgrep jq
      - name: Benchmark restart and input integrity
        run: bash scripts/test_ane_benchmark_resume.sh
      # A hung test fails with a spindump in the result bundle, instead of
      # silently using up the job. An interface string without Thai in
      # macos/OLIV/Localizable.xcstrings fails LocalizationCatalogTests
      # (xcodebuild hands TEST_RUNNER_* variables to the tests without the
      # prefix); drop TEST_RUNNER_OLIV_REQUIRE_TRANSLATIONS to let English-only
      # strings land.
      - name: Build and test
        env:
          TEST_RUNNER_OLIV_REQUIRE_TRANSLATIONS: "1"
          OLIV_XCTEST_ARGS: >-
            -test-timeouts-enabled YES
            -default-test-execution-time-allowance 180
            -maximum-test-execution-time-allowance 300
            -resultBundlePath build/test-results.xcresult
        run: bash scripts/test.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mac-test-results
          path: build/test-results.xcresult
