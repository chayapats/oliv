name: Mac app

on:
  push:
    branches: [main]
    paths:
      - 'macos/**'
      - 'rust/**'
      - 'scripts/**'
      - 'tools/**'
      - '.github/workflows/mac.yml'
  pull_request:
    paths:
      - 'macos/**'
      - 'rust/**'
      - 'scripts/**'
      - 'tools/**'
      - '.github/workflows/mac.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Format and lint
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --locked --manifest-path rust/Cargo.toml --workspace

  app:
    name: Native runtime and XCTest
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # One rustc call first: rustup finishes any component download here, not
      # across cargo's parallel build, where the downloads collide.
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version
          echo "OLIV_CARGO=$(command -v cargo)" >> "$GITHUB_ENV"
      - name: Build tools
        run: brew install xcodegen ripgrep
      - name: Build and test
        run: bash scripts/test.sh
