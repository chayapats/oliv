name: Feature request
description: A change you'd like in OLIV
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thai or English is fine.
  - type: textarea
    id: problem
    attributes:
      label: What is painful today
      description: The situation, not the implementation. e.g. "STT keeps writing Kubernetes as Thai syllables."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like instead
      description: A sketch is enough. Maintainers will push back if it fights the local-first / no-cloud-by-default design.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dictation / cleanup quality
        - Settings or menu
        - Install / models / updates
        - Docs or benchmark
        - Something else
    validations:
      required: true
