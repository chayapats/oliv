[package]
name = "oliv"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "3.4", default-features = false, features = ["json", "rustls"] }
url = "2.5"
httpdate = "1"
base64 = "0.22"
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "preserve_order"] }
tiny-skia = "0.12.0"
rustybuzz = "0.20.1"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "0.10"
libc = "0.2"
smithay-client-toolkit = "0.21.1"

[target.'cfg(windows)'.dependencies]
cpal = "0.16"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security",
    "Win32_Security_Authorization", "Win32_Storage_FileSystem",
    "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_Memory",
    "Win32_System_Ole", "Win32_System_Pipes", "Win32_System_LibraryLoader",
    "Win32_System_Threading", "Win32_System_Time", "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
