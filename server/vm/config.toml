# Read by start.sh, whisper_server.py, oliv-api and the dashboard.
# Gemma: context 2048, 1 slot, KV q8_0, flash attention on, reasoning off.
# Binds are locked to loopback so nothing is exposed beyond this machine.
# Model paths are relative to this directory and must stay under models/.

[gemma]
model = "models/gemma/gemma-4-E2B-it-Q4_K_M.gguf"
host = "127.0.0.1"
port = 8081
gpu_layers = 99
context = 2048
batch = 256
ubatch = 256
kv_k = "q8_0"
kv_v = "q8_0"
flash_attn = "on"
slots = 1
reasoning = "off"

[whisper]
model = "models/whisper/typhoon-turbo-int8-float16"
host = "127.0.0.1"
port = 8082
device = "cuda"
compute_type = "int8_float32"
beam_size = 1

[dashboard]
host = "127.0.0.1"
port = 8090

# oliv-api: loopback, or one private overlay IP (100.64.0.0/10); never public.
# auth_mode=keys uses api-keys.json (manage with bin/oliv-keys).
# prompt is the cleanup prompt (v2/v3/v4/v5); llm_timeout is seconds to wait for Gemma.
# asr_profile: turbo (typhoon-whisper-turbo via [whisper] above), typhoon-ctx, or
# qwen3asr (needs your own Qwen3-ASR GGUF package and qwen-profile.json; see
# qwen-profile.example.json). asr_concurrency > 1 is supported only by qwen3asr.
[api]
auth_mode = "keys"
host = "127.0.0.1"
port = 8083
prompt = "v5"
llm_timeout = 5
asr_profile = "turbo"
asr_concurrency = 1
